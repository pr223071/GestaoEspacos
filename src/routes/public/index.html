<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gestão de Espaços</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                Gestão de Espaços
            </a>

            <div>

                <a
                    href="/docs"
                    target="_blank"
                    class="btn btn-outline-light"
                >
                    Swagger API
                </a>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO -->

    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">
                    Reservas
                </h1>

                <p class="text-muted mb-0">
                    Gerenciamento de reservas dos espaços
                </p>

            </div>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalReserva"
                onclick="abrirModalNovaReserva()"
            >
                + Nova Reserva
            </button>

        </div>


        <!-- FILTRO -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">
                            Buscar por data
                        </label>

                        <input type="date" id="filtroData" class="form-control">
                    </div>

                    <div class="col-md-4 d-flex align-items-end">
                        <button class="btn btn-primary me-2" onclick="buscarPorData()">
                            Buscar
                        </button>

                        <button class="btn btn-secondary" onclick="carregarReservas()">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>

                                <th>Espaço</th>

                                <th>Usuário</th>

                                <th>Início</th>

                                <th>Fim</th>

                                <th>Status</th>

                                <th class="text-end"> Ações </th>
                            </tr>
                        </thead>
                        <tbody id="tabelaReservas">
                          <!-- RESERVAS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>


    <!-- MODAL -->

    <div class="modal fade" id="modalReserva" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tituloModal">
                        Nova Reserva
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="reservaId">

                    <div class="mb-3">
                        <label class="form-label">
                            Espaço
                        </label>
                        <select id="space_id" class="form-select" required>
                            <option value="">
                                Selecione o espaço
                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Usuário
                        </label>

                        <select id="user_id" class="form-select" required>

                            <option value="">
                                Selecione o usuário
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Data e hora de início
                        </label>
                        <input type="datetime-local" id="start_datetime" class="form-control" required>

                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Data e hora de término
                        </label>

                        <input type="datetime-local" id="end_datetime" class="form-control" required>
                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select id="status" class="form-select">
                            <option value="PENDING">
                                Pendente
                            </option>

                            <option value="APPROVED">
                                Aprovada
                            </option>

                            <option value="REJECTED">
                                Rejeitada
                            </option>

                            <option value="CANCELLED">
                                Cancelada
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Motivo da rejeição
                        </label>

                        <textarea id="rejection_reason" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancelar
                    </button>

                    <button type="button" class="btn btn-primary" onclick="salvarReserva()">
                        Salvar
                    </button>
                </div>
            </div>
        </div>
  </div>
    <!-- BOOTSTRAP -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src = ".\js\script.js"></script>
</body>

</html>
